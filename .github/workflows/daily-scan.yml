name: Daily job scan

on:
  schedule:
    # 08:30 IST == 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jobscout
        run: pip install -e ".[all]"

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: jobscout scan --profile profiles/amit.yaml --new-only --out reports/latest.md

      - name: Commit report and seen-jobs cache if changed
        run: |
          git config user.name "jobscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest.md data/seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily job scan $(date -u +%Y-%m-%d)"
            git push
          fi
